<!DOCTYPE html>
<html>
<head>
    <title>Bearing Calculation Test</title>
</head>
<body>
    <h1>Haversine Bearing Calculation Test</h1>
    <div id="results"></div>

    <script>
        // Test the haversine bearing calculation
        function calculateBearing(lat1, lng1, lat2, lng2) {
            // Convert degrees to radians
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lng2 - lng1) * Math.PI / 180;

            // Calculate bearing using haversine formula
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);

            // Convert to degrees and normalize to 0-360
            let bearing = Math.atan2(y, x) * 180 / Math.PI;
            bearing = (bearing + 360) % 360;

            return Math.round(bearing);
        }

        // Test cases
        const tests = [
            { name: "London to Paris", from: [51.5074, -0.1278], to: [48.8566, 2.3522], expected: "around 135° (SE)" },
            { name: "Due North", from: [50.0, 0.0], to: [51.0, 0.0], expected: "0° (N)" },
            { name: "Due East", from: [50.0, 0.0], to: [50.0, 1.0], expected: "90° (E)" },
            { name: "Due South", from: [51.0, 0.0], to: [50.0, 0.0], expected: "180° (S)" },
            { name: "Due West", from: [50.0, 1.0], to: [50.0, 0.0], expected: "270° (W)" }
        ];

        const resultsDiv = document.getElementById('results');
        
        tests.forEach(test => {
            const bearing = calculateBearing(test.from[0], test.from[1], test.to[0], test.to[1]);
            resultsDiv.innerHTML += `
                <p><strong>${test.name}:</strong><br>
                From: ${test.from[0]}, ${test.from[1]}<br>
                To: ${test.to[0]}, ${test.to[1]}<br>
                Calculated bearing: ${bearing}°<br>
                Expected: ${test.expected}<br><br></p>
            `;
        });
    </script>
</body>
</html>
